# Neowave Work — 1단계(개발 PC) 컨테이너 구성 (DEC-013)
#
# 컨테이너는 둘뿐입니다. web·worker 는 호스트에서 `npm run dev` 로 돌리고
# (Windows 에서 컨테이너 안 파일 감시가 불안정합니다 — DEV-01 · 1.9절),
# 파일 저장소는 컨테이너 없이 로컬 폴더를 씁니다 (MinIO 미사용 — DEC-019).
#
#   docker compose -f docker/docker-compose.dev.yml up -d
#   docker compose -f docker/docker-compose.dev.yml down

name: neowave-work-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: neowave-work-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neowave_work}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neowave_work}
      POSTGRES_DB: ${POSTGRES_DB:-neowave_work}
      # 한국어 정렬·비교를 위해 초기화 옵션을 명시한다. 나중에 바꾸려면 재초기화가 필요하다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 호스트 5433 → 컨테이너 5432. 이 PC의 다른 프로젝트(JIDO)가 5432 를 쓰고 있어
      # Neowave Work 이 비켜갑니다 (DEC-033 — 포트 3000→3100 과 같은 이유).
      - "5433:5432"
    volumes:
      # named volume 을 쓴다. 프로젝트 폴더에 바인드 마운트하면
      # WSL2 ↔ Windows 파일시스템 왕복으로 눈에 띄게 느려진다 (DEV-01 · 1.9절 주의사항).
      - neowave-work-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neowave_work} -d ${POSTGRES_DB:-neowave_work}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neowave-work-redis
    restart: unless-stopped
    # 큐(BullMQ)가 올라가므로 메모리가 차도 키를 임의로 버리면 안 된다.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      # 호스트 6380 → 컨테이너 6379 (DEC-033)
      - "6380:6379"
    volumes:
      - neowave-work-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neowave-work-pg:
  neowave-work-redis:
