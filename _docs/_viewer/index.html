<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neowave Work 문서 뷰어</title>
<!-- 파비콘: lucide `hexagon`. 이모지를 아이콘으로 쓰지 않는다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230f172a'/%3E%3Cg%20transform='translate(4%204)'%20fill='%23ffffff'%20stroke='%23ffffff'%20stroke-width='2'%20stroke-linejoin='round'%3E%3Cpath%20d='M21%2016V8a2%202%200%200%200-1-1.73l-7-4a2%202%200%200%200-2%200l-7%204A2%202%200%200%200%203%208v8a2%202%200%200%200%201%201.73l7%204a2%202%200%200%200%202%200l7-4A2%202%200%200%200%2021%2016z'/%3E%3C/g%3E%3C/svg%3E" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
<link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" disabled />

<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f6f7f9;
    --bg-sidebar: #fbfbfc;
    --text: #1f2328;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --border-soft: #eef0f2;
    --accent: #2563eb;
    --accent-soft: rgba(37, 99, 235, 0.1);
    --code-bg: #f3f4f6;
    --pre-bg: #f6f8fa;
    --table-head: #f6f7f9;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    /* 스크롤바(및 폼 컨트롤) 를 테마에 맞춘다 */
    color-scheme: light;
    --sb-thumb: #c9ced6;
    --sb-thumb-hover: #aab1bb;
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --bg-sidebar: #0f141a;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --border: #21262d;
    --border-soft: #1b2027;
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.14);
    --code-bg: #1b2027;
    --pre-bg: #161b22;
    --table-head: #161b22;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
    --sb-thumb: #30363d;
    --sb-thumb-hover: #454d57;
  }

  /* 스크롤바 — Firefox */
  * { scrollbar-color: var(--sb-thumb) transparent; scrollbar-width: thin; }
  /* 스크롤바 — WebKit/Blink */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--sb-thumb); border-radius: 8px;
    border: 2px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  * { box-sizing: border-box; }
  html { height: 100%; }
  /* body 를 height:100% 로 두면 sticky 헤더가 붙어 있을 수 있는 범위가
     body 박스(= 1 뷰포트) 로 잘려서, 긴 문서에서 헤더가 스크롤에 딸려 올라간다.
     min-height 로 두어 body 박스가 문서 전체 높이만큼 자라게 한다. */
  body { margin: 0; min-height: 100%; }
  body {
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Topbar ── */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    height: 52px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .crumb { color: var(--text-muted); font-size: 13px; margin-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); cursor: pointer; font-size: 16px;
  }
  .icon-btn:hover { background: var(--bg-soft); }
  .menu-btn { display: none; }
  /* lucide 아이콘 — 제품과 같은 라이브러리(lucide-react v1.20.0)의 path 를 인라인으로 옮겼다.
     CDN 을 하나 더 붙이지 않는 이유: 이 뷰어는 file:// 로 열리고, 아이콘 두 개 때문에
     네트워크 의존을 늘리면 오프라인에서 버튼이 빈칸이 된다. */
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  /* 버튼은 **바뀔 상태**를 보여 준다 — 라이트에서는 달(누르면 다크), 다크에서는 해(누르면 라이트). */
  #themeBtn .ico-sun { display: none; }
  [data-theme="dark"] #themeBtn .ico-sun { display: block; }
  [data-theme="dark"] #themeBtn .ico-moon { display: none; }

  /* 페이지 ID 칩 (클릭 복사) */
  .pageid {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    font-size: 12px; letter-spacing: .04em; line-height: 1;
    color: var(--text-muted); background: var(--bg-soft);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 10px; cursor: copy; white-space: nowrap; user-select: none;
    transition: color .12s ease, background .12s ease, border-color .12s ease;
  }
  .pageid:hover { color: var(--text); border-color: var(--accent); }
  .pageid:active { transform: translateY(1px); }
  .pageid.copied { color: #fff; background: var(--accent); border-color: var(--accent); }

  /* ── Layout ── */
  .layout { display: grid; grid-template-columns: 288px minmax(0, 1fr) 240px; align-items: start; }
  @media (max-width: 1200px) { .layout { grid-template-columns: 288px minmax(0, 1fr); } .toc { display: none; } }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .menu-btn { display: inline-flex; }
    .sidebar {
      position: fixed; top: 52px; left: 0; bottom: 0; width: 300px; z-index: 40;
      transform: translateX(-100%); transition: transform .22s ease; box-shadow: var(--shadow);
    }
    .sidebar.open { transform: translateX(0); }
    .backdrop { display: none; position: fixed; inset: 52px 0 0 0; background: rgba(0,0,0,.4); z-index: 39; }
    .backdrop.show { display: block; }
  }

  /* ── Sidebar ── */
  .sidebar {
    position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto;
    background: var(--bg-sidebar); border-right: 1px solid var(--border);
    padding: 12px 10px 40px;
  }
  .search {
    width: 100%; height: 36px; padding: 0 12px; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
    color: var(--text); font-size: 13.5px; font-family: inherit; outline: none;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .group { margin-bottom: 6px; }
  .group-head {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 7px 8px; border: none; background: none; cursor: pointer;
    color: var(--text); font-weight: 700; font-size: 13px; text-align: left;
    border-radius: 7px; font-family: inherit;
  }
  .group-head:hover { background: var(--bg-soft); }
  .group-head .chev { transition: transform .15s ease; color: var(--text-muted); font-size: 11px; }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .group.collapsed .files { display: none; }
  .files { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 4px 6px; }
  .file {
    display: block; padding: 6px 10px; border-radius: 7px; cursor: pointer;
    color: var(--text-muted); font-size: 13px; line-height: 1.4;
    border-left: 2px solid transparent; text-decoration: none;
  }
  .file:hover { background: var(--bg-soft); color: var(--text); text-decoration: none; }
  .file.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; border-left-color: var(--accent); }
  .no-result { color: var(--text-muted); font-size: 13px; padding: 12px 8px; }

  /* ── Content ── */
  .content { min-width: 0; padding: 32px 48px 96px; }
  @media (max-width: 860px) { .content { padding: 24px 20px 80px; } }
  .doc { max-width: 860px; margin: 0 auto; }

  /* Markdown 스타일 */
  .doc h1, .doc h2, .doc h3, .doc h4 { line-height: 1.3; margin: 1.6em 0 .6em; font-weight: 700; scroll-margin-top: 64px; }
  .doc h1 { font-size: 1.9rem; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .doc h2 { font-size: 1.45rem; padding-bottom: .3em; border-bottom: 1px solid var(--border-soft); }
  .doc h3 { font-size: 1.2rem; }
  .doc h4 { font-size: 1.02rem; }
  .doc p { margin: .7em 0; line-height: 1.75; }
  .doc ul, .doc ol { margin: .6em 0; padding-left: 1.6em; line-height: 1.8; }
  .doc li { margin: .2em 0; }
  .doc li > ul, .doc li > ol { margin: .2em 0; }
  .doc blockquote {
    margin: 1em 0; padding: .4em 1em; color: var(--text-muted);
    border-left: 3px solid var(--border); background: var(--bg-soft); border-radius: 0 6px 6px 0;
  }
  .doc blockquote p { margin: .3em 0; }
  .doc code {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .86em; background: var(--code-bg); padding: .15em .4em; border-radius: 5px;
  }
  .doc pre {
    margin: 1em 0; padding: 14px 16px; overflow-x: auto;
    background: var(--pre-bg); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; line-height: 1.6;
  }
  .doc pre code { background: none; padding: 0; font-size: 13px; }
  /* 표 — 가로 스크롤은 **감싼 상자**가 맡는다.
     예전에는 table 자체에 display:block + overflow-x 를 걸었는데, 그러면 표가 표 상자가
     아니게 되어 width:100% 가 블록 껍데기에만 걸리고 안쪽 익명 표는 내용 너비로 줄어든다
     (선언은 있는데 표가 왼쪽에 좁게 붙어 보이던 원인). 스크롤을 래퍼로 옮기고 표는 표로 둔다. */
  .doc .tablewrap { overflow-x: auto; max-width: 100%; margin: 1em 0; }
  .doc table {
    border-collapse: collapse; margin: 0; width: 100%; font-size: 14px;
  }
  .doc th, .doc td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  /* 머리행은 줄바꿈하지 않되, 표가 컨테이너를 넘으면 래퍼가 스크롤한다. */
  .doc th { background: var(--table-head); font-weight: 600; white-space: nowrap; }
  .doc tr:nth-child(even) td { background: var(--bg-soft); }
  /* 도식 — 렌더 전에는 코드 블록처럼 보이고(실패해도 원문이 읽힌다),
     mermaid 가 성공하면 data-processed 가 붙어 껍데기를 벗는다. */
  .doc pre.mermaid {
    margin: 1.4em 0; padding: 14px 16px; overflow-x: auto;
    background: var(--pre-bg); border: 1px solid var(--border); border-radius: 10px;
    font-size: 13px; line-height: 1.6;
  }
  .doc pre.mermaid[data-processed] {
    background: none; border: 0; padding: 0; text-align: center; line-height: normal;
  }
  .doc pre.mermaid svg { max-width: 100%; height: auto; }
  .doc hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .doc img { max-width: 100%; border-radius: 8px; }
  .doc a { word-break: break-word; }

  /* ── TOC ── */
  .toc { position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; padding: 32px 16px; }
  .toc-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .toc a {
    display: block; padding: 4px 10px; margin: 1px 0; font-size: 12.5px; color: var(--text-muted);
    border-left: 2px solid var(--border-soft); line-height: 1.4;
  }
  .toc a:hover { color: var(--text); text-decoration: none; }
  .toc a.h3 { padding-left: 22px; font-size: 12px; }
  .toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

  .loading { color: var(--text-muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
    <div class="brand"><span class="dot"></span> Neowave Work 문서</div>
    <div class="crumb" id="crumb"></div>
    <div class="spacer"></div>
    <button class="pageid" id="pageId" title="클릭하여 복사"></button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환">
      <svg class="ico-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      <svg class="ico-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <input class="search" id="search" type="text" placeholder="문서 검색..." autocomplete="off" />
      <nav id="tree"></nav>
    </aside>

    <main class="content">
      <article class="doc" id="doc"><div class="loading">문서를 불러오는 중…</div></article>
    </main>

    <aside class="toc"><div class="toc-title">목차</div><nav id="toc"></nav></aside>
  </div>
  <div class="backdrop" id="backdrop"></div>

<script src="content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<!-- mermaid — **로컬 번들**이다(CDN 아님). 이 뷰어는 file:// 로 열리므로 v11 의 ESM 빌드는
     모듈 스크립트가 되어 브라우저에 따라 막힌다. v10.9.3 은 UMD 라 일반 <script src> 로 실려
     window.mermaid 를 등록하고, 오프라인에서도 도식이 그려진다. -->
<script src="mermaid.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var docEl = $("#doc"), treeEl = $("#tree"), tocEl = $("#toc"), crumbEl = $("#crumb"), pageIdEl = $("#pageId");

  if (!window.DOCS || !window.DOCS.groups) {
    docEl.innerHTML = '<div class="loading">content.js 를 찾을 수 없습니다.<br>터미널에서 <code>node build.mjs</code> 를 실행해 생성하세요.</div>';
    return;
  }
  var GROUPS = window.DOCS.groups;

  if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });

  // ── 사이드바 트리 구성 ──
  var fileEls = []; // { el, gi, fi, group, title }
  GROUPS.forEach(function (g, gi) {
    var group = document.createElement("div");
    group.className = "group";
    var head = document.createElement("button");
    head.className = "group-head";
    head.innerHTML = '<span class="chev">▾</span><span>' + esc(g.label) + "</span>";
    head.onclick = function () { group.classList.toggle("collapsed"); };
    group.appendChild(head);

    var files = document.createElement("div");
    files.className = "files";
    g.files.forEach(function (f, fi) {
      var a = document.createElement("a");
      a.className = "file";
      a.textContent = f.title;
      a.href = "#" + encodeURIComponent(g.name) + "/" + encodeURIComponent(f.file);
      files.appendChild(a);
      fileEls.push({ el: a, gi: gi, fi: fi, group: g.label, title: f.title });
    });
    group.appendChild(files);
    treeEl.appendChild(group);
  });

  // ── 문서 선택/렌더 ──
  var current = null;
  function select(gi, fi, push) {
    var g = GROUPS[gi]; if (!g) return;
    var f = g.files[fi]; if (!f) return;
    current = { gi: gi, fi: fi };

    var html = window.marked ? marked.parse(f.md) : "<pre>" + esc(f.md) + "</pre>";
    docEl.innerHTML = html;

    // 표를 스크롤 래퍼로 감싼다. marked 는 <table> 만 내보내므로 여기서 씌운다 —
    // 표는 width:100% 인 표 상자로 두고, 넘칠 때의 가로 스크롤만 래퍼가 맡는다.
    docEl.querySelectorAll("table").forEach(function (t) {
      if (t.parentNode && t.parentNode.classList.contains("tablewrap")) return;
      var wrap = document.createElement("div");
      wrap.className = "tablewrap";
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });

    // 문서 안의 상대 링크를 뷰어 좌표로 옮긴다.
    fixLinks(g.name);

    // ```mermaid 블록을 도식 자리로 바꾼다. **하이라이트보다 먼저** 해야 한다 —
    // 뒤로 미루면 hljs 가 먼저 <code> 안을 span 으로 쪼개 mermaid 가 원문을 못 읽는다.
    // 원문은 data-src 에 남긴다(테마 전환 시 다시 그리려면 원문이 필요하다).
    prepMermaid();

    // 코드 하이라이트 — mermaid 블록은 위에서 <pre class="mermaid"> 로 바뀌어 이 선택자에 안 걸린다.
    if (window.hljs) docEl.querySelectorAll("pre code").forEach(function (b) { try { hljs.highlightElement(b); } catch (e) {} });

    // 도식 그리기. 실패해도 문서 렌더는 계속된다(원문이 그대로 보인다).
    renderMermaid();

    // 헤딩 id 부여 + 목차
    buildToc();

    // 활성 표시
    fileEls.forEach(function (fe) {
      var on = fe.gi === gi && fe.fi === fi;
      fe.el.classList.toggle("active", on);
    });
    crumbEl.innerHTML = esc(g.label) + " / <b>" + esc(f.title) + "</b>";
    document.title = f.title + " — Neowave Work 문서";

    // 페이지 ID
    var pid = f.id || "";
    pageIdEl.textContent = pid;
    pageIdEl.dataset.pid = pid;
    pageIdEl.style.display = pid ? "" : "none";

    // 접힌 그룹 펼치기
    var groupEl = treeEl.children[gi];
    if (groupEl) groupEl.classList.remove("collapsed");

    window.scrollTo(0, 0);
    closeSidebar();

    var hash = "#" + encodeURIComponent(g.name) + "/" + encodeURIComponent(f.file);
    if (push && location.hash !== hash) history.pushState(null, "", hash);
  }

  function buildToc() {
    tocEl.innerHTML = "";
    var heads = docEl.querySelectorAll("h2, h3");
    if (!heads.length) return;
    heads.forEach(function (h, i) {
      var id = "h-" + i;
      h.id = id;
      var a = document.createElement("a");
      a.className = h.tagName === "H3" ? "h3" : "h2";
      a.textContent = h.textContent;
      a.href = "#" + id;
      a.onclick = function (e) {
        e.preventDefault();
        h.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      tocEl.appendChild(a);
    });
  }

  // ── 해시 라우팅 ──
  function fromHash() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!h || h.indexOf("/") === -1) return false;
    // 헤딩 앵커(h-N)는 무시
    if (/^h-\d+$/.test(h)) return true;
    var idx = h.indexOf("/");
    var gname = h.slice(0, idx), fname = h.slice(idx + 1);
    for (var gi = 0; gi < GROUPS.length; gi++) {
      if (GROUPS[gi].name !== gname) continue;
      for (var fi = 0; fi < GROUPS[gi].files.length; fi++) {
        if (GROUPS[gi].files[fi].file === fname) { select(gi, fi, false); return true; }
      }
    }
    return false;
  }
  window.addEventListener("hashchange", function () {
    if (/^#h-\d+$/.test(location.hash)) return; // 목차 내부 앵커
    fromHash();
  });

  // ── 검색 ──
  $("#search").addEventListener("input", function (e) {
    var q = e.target.value.trim().toLowerCase();
    var anyGlobal = false;
    GROUPS.forEach(function (g, gi) {
      var groupEl = treeEl.children[gi];
      var visible = 0;
      g.files.forEach(function (f, fi) {
        var fe = fileEls.filter(function (x) { return x.gi === gi && x.fi === fi; })[0];
        var match = !q || f.title.toLowerCase().indexOf(q) !== -1 || g.label.toLowerCase().indexOf(q) !== -1;
        fe.el.style.display = match ? "" : "none";
        if (match) visible++;
      });
      groupEl.style.display = visible ? "" : "none";
      if (q && visible) groupEl.classList.remove("collapsed");
      anyGlobal = anyGlobal || visible > 0;
    });
  });

  // ── 문서 간 링크 ──
  // 마크다운은 **파일 기준** 상대 경로를 그대로 쓴다(같은 폴더는 `./02_데이터_모델.md`,
  // 다른 폴더는 `../01.요구사항/04_콘텐츠_도메인_모델.md`). 에디터·GitHub 에서는 그게 맞는
  // 경로이고, 실제로 파일도 거기 있다.
  // 문제는 뷰어다. content.js 를 _viewer/index.html 이 읽으므로 브라우저는 상대 경로를
  // **_viewer/ 기준**으로 푼다 — `./02_데이터_모델.md` 가 `_docs/_viewer/02_데이터_모델.md` 가 되어 전부 깨진다.
  // 그래서 마크다운을 고치지 않고(고치면 에디터에서 깨진다) **여기서 좌표만 옮긴다.**

  // 문서가 속한 폴더를 기준으로 상대 경로를 풀어 _docs 루트 기준 경로를 만든다.
  function resolveFromDoc(groupName, raw) {
    // 루트 그룹(_docs 바로 아래)의 이름은 빈 문자열이다. 그걸 배열에 넣으면 경로가 한 칸 밀린다.
    var base = groupName ? [groupName] : [];
    raw.split("/").forEach(function (p) {
      if (p === "" || p === ".") return;
      if (p === "..") { base.pop(); return; }
      base.push(p);
    });
    return base;
  }
  var GROUP_NAMES = {};
  GROUPS.forEach(function (g) { GROUP_NAMES[g.name] = true; });

  function fixLinks(groupName) {
    docEl.querySelectorAll("a[href]").forEach(function (a) {
      var raw = a.getAttribute("href");
      if (!raw) return;
      // 외부 주소·문서 안 앵커는 건드리지 않는다.
      if (/^([a-z][a-z0-9+.-]*:|#|\/\/)/i.test(raw)) return;

      var parts = resolveFromDoc(groupName, raw.split("#")[0]);
      var isMd = /\.md$/i.test(parts[parts.length - 1]);

      // 뷰어가 아는 문서(그룹 바로 아래 .md)면 해시로 이동한다 — 페이지를 떠나지 않는다.
      if (isMd && parts.length === 2 && GROUP_NAMES[parts[0]]) {
        a.setAttribute("href", "#" + encodeURIComponent(parts[0]) + "/" + encodeURIComponent(parts[1]));
        return;
      }
      // _docs 루트의 .md(진입점 README 등). 그룹명이 빈 문자열이라 해시는 `#/README.md` 다.
      if (isMd && parts.length === 1 && GROUP_NAMES[""] !== undefined) {
        a.setAttribute("href", "#/" + encodeURIComponent(parts[0]));
        return;
      }
      // 그 밖(HTML·이미지·뷰어가 스캔하지 않는 하위 폴더)은 파일로 연다.
      // _viewer/ 기준이므로 한 단계 올라간다. 새 탭으로 열어 읽던 문서를 잃지 않게 한다.
      a.setAttribute("href", "../" + parts.join("/"));
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noreferrer");
    });
  }

  // ── 도식 (mermaid) ──
  // 로컬 UMD 번들(mermaid.min.js)이 window.mermaid 를 등록한다.
  // 번들이 없거나 문법이 틀리면 **원문이 코드 블록 그대로 보인다** — 빈 자리로 삼키지 않는다.
  var mermaidReady = false;
  function mermaidTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "default";
  }
  function initMermaid() {
    if (!window.mermaid) return false;
    mermaid.initialize({
      startOnLoad: false,
      theme: mermaidTheme(),
      securityLevel: "strict",
      fontFamily: "Pretendard, -apple-system, system-ui, sans-serif",
      flowchart: { curve: "basis", useMaxWidth: true }
    });
    mermaidReady = true;
    return true;
  }
  // ```mermaid → <pre class="mermaid" data-src="원문">
  // 원문을 data-src 에 남기는 이유: mermaid 는 렌더할 때 요소 내용을 SVG 로 갈아치운다.
  // 테마를 바꿔 다시 그리려면 원문이 필요한데, 그때는 이미 SVG 라 복원할 곳이 없다.
  function prepMermaid() {
    docEl.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
      var pre = code.parentNode;
      var src = code.textContent;
      var box = document.createElement("pre");
      box.className = "mermaid";
      box.setAttribute("data-src", src);
      box.textContent = src;
      pre.parentNode.replaceChild(box, pre);
    });
  }
  function renderMermaid() {
    var nodes = docEl.querySelectorAll("pre.mermaid");
    if (!nodes.length) return;
    if (!window.mermaid) { console.warn("[mermaid] 번들을 못 불러왔습니다 — 도식이 원문으로 표시됩니다."); return; }
    if (!mermaidReady && !initMermaid()) return;
    nodes.forEach(function (n) {
      n.removeAttribute("data-processed");
      n.textContent = n.getAttribute("data-src") || n.textContent;
    });
    try {
      var p = mermaid.run({ nodes: Array.prototype.slice.call(nodes) });
      if (p && p.catch) p.catch(function (e) { console.warn("[mermaid] 렌더 실패:", e); });
    } catch (e) { console.warn("[mermaid] 렌더 실패:", e); }
  }

  // ── 다크 모드 ──
  var themeBtn = $("#themeBtn");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("#hljs-light").disabled = t === "dark";
    $("#hljs-dark").disabled = t !== "dark";
    // 아이콘 교체는 CSS 가 [data-theme] 로 한다(위 #themeBtn .ico-* 규칙).
    // 여기서는 **누르면 무엇이 되는지**만 갱신한다 — 아이콘만 바뀌고 라벨이 고정이면
    // 스크린리더는 다크에서도 "다크 모드로 전환"을 읽는다.
    var next = t === "dark" ? "라이트 모드로 전환" : "다크 모드로 전환";
    themeBtn.setAttribute("aria-label", next);
    themeBtn.setAttribute("title", next);
    // 도식은 렌더 시점의 테마 색을 SVG 에 구워 낸다 — 테마를 바꾸면 다시 그려야 한다.
    // (안 그리면 다크 배경에 라이트 도식이 그대로 남는다.)
    mermaidReady = false;
    renderMermaid();
    try { localStorage.setItem("viewer-theme", t); } catch (e) {}
  }
  themeBtn.onclick = function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  };
  var saved = "light";
  try { saved = localStorage.getItem("viewer-theme") || "light"; } catch (e) {}
  applyTheme(saved);

  // ── 모바일 사이드바 ──
  var sidebar = $("#sidebar"), backdrop = $("#backdrop");
  $("#menuBtn").onclick = function () { sidebar.classList.toggle("open"); backdrop.classList.toggle("show"); };
  backdrop.onclick = closeSidebar;
  function closeSidebar() { sidebar.classList.remove("open"); backdrop.classList.remove("show"); }

  // ── 페이지 ID 복사 ──
  pageIdEl.onclick = function () {
    var id = pageIdEl.dataset.pid;
    if (!id) return;
    var feedback = function () {
      pageIdEl.classList.add("copied");
      pageIdEl.textContent = "복사됨!";
      setTimeout(function () {
        pageIdEl.classList.remove("copied");
        pageIdEl.textContent = pageIdEl.dataset.pid;
      }, 1000);
    };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = id; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand("copy"); feedback(); } catch (e) {}
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).then(feedback).catch(fallback);
    } else {
      fallback();
    }
  };

  // ── 유틸 ──
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // ── 시작 ──
  var hasDoc = GROUPS.some(function (g) { return g.files.length > 0; });
  if (!hasDoc) {
    docEl.innerHTML = '<div class="loading">표시할 문서가 없습니다.<br>' +
      '<code>_docs/01.요구사항</code> 같은 그룹 폴더에 .md 파일을 추가한 뒤 ' +
      '<code>node build.mjs</code> 를 실행하세요.</div>';
    pageIdEl.style.display = "none";
  } else if (!fromHash()) {
    select(0, 0, true);
  }
})();
</script>
</body>
</html>
